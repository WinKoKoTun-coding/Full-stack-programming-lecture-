<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #display {
            box-sizing: border-box;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(4, minmax(300px, 1fr));
            gap: 10px;
            padding: 3em;
            
        }
        #display p{
            margin: 5px;
            padding: 5px;
            border: 1px solid black;  
            
            height: 200px;  
        }
        

        
    </style>

    
    <div id="display"></div>
    <script>
        
      let arr = [1,2,3,4,5]
      let i = 0;
       let num = []
      while( i <arr.length ){
        
        for (n in arr){
           
            num.push(arr[n]+",");
            i++;

        }

         
       
        
      }
      console.log(num)
       
      

    </script>

</body>
</html>
